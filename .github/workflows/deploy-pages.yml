name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Assemble static site
        run: |
          mkdir -p _site/leaves2
          
          # Root landing portal
          cp index.html _site/index.html
          
          # Root-level direct deliverables
          cp leaves2/slides.html _site/slides.html
          cp leaves2/report.html _site/report.html
          
          # Mirror in leaves2/ directory for path backwards-compatibility
          cp leaves2/slides.html _site/leaves2/slides.html
          cp leaves2/report.html _site/leaves2/report.html
          
          # Visual assets
          cp leaves2/height_vs_width.png _site/leaves2/height_vs_width.png || true
          cp -r leaves2/results _site/leaves2/ || true

          # Snake game
          mkdir -p _site/snake
          cp -r snake/* _site/snake/

          # Slides with animation & PDF note
          mkdir -p _site/slides-with-animation-pdf-note
          cp -r slides-with-animation-pdf-note/* _site/slides-with-animation-pdf-note/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
